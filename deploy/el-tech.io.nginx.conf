# ============================================================================
# EL Tech — Blöcke für den REVERSE-PROXY (global_nginx)
#
# ACHTUNG: NICHT die nginx.conf dieses Repos! Die ist der Webserver IM Container.
# Diese Blöcke kommen auf dem Server in:
#     /projects/infra-proxy/config/nginx.conf
# und zwar INNERHALB von  http { ... }  (vor der letzten schließenden Klammer }).
#
# Reihenfolge (wichtig, sonst schlägt `nginx -t` fehl):
#   1) NUR Block A (HTTP) einfügen  ->  reload
#   2) Zertifikat holen (auf dem Host):
#        certbot certonly --webroot -w /projects/infra-proxy/html \
#                -d el-tech.io -d www.el-tech.io
#   3) DANN Block B (HTTPS) einfügen  ->  reload
#
# Reload:
#   docker exec global_nginx nginx -t && docker exec global_nginx nginx -s reload
# ============================================================================


# ---- BLOCK A: zuerst einfügen (HTTP: ACME-Challenge + Redirect) ----
server {
    listen 80;
    server_name el-tech.io www.el-tech.io;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/certbot;
    }
    location / {
        return 301 https://el-tech.io$request_uri;
    }
}


# ---- BLOCK B: erst NACH dem Zertifikat einfügen (HTTPS) ----
server {
    listen 443 ssl;
    server_name www.el-tech.io;
    ssl_certificate     /etc/letsencrypt/live/el-tech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/el-tech.io/privkey.pem;
    return 301 https://el-tech.io$request_uri;
}

server {
    listen 443 ssl;
    server_name el-tech.io;
    ssl_certificate     /etc/letsencrypt/live/el-tech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/el-tech.io/privkey.pem;

    location / {
        proxy_pass http://eltech-website:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
