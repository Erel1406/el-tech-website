services:
  web:
    build: .
    image: eltech-website
    container_name: eltech-website
    restart: unless-stopped
    networks:
      - proxy
    # Kein Host-Port nötig: global_nginx erreicht den Container über das
    # gemeinsame Netzwerk als "eltech-website:80".
    # Nur zum lokalen Testen optional: ports: ["127.0.0.1:8090:80"]

networks:
  proxy:
    external: true
    name: cc_shared_net
