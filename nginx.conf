server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version verstecken
    server_tokens off;

    # ---- Kompression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Statische Assets: lange cachen (+ Security-Header) ----
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ---- Alte .html-Adressen -> saubere URL (301, SEO) ----
    location = /index.html { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }

    # ---- Saubere URLs: /leistungen -> leistungen.html
    #      (+ Security-Header, HTML nicht cachen) ----
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
