# Wird in JEDE location eingebunden, damit die Header immer gesetzt werden.
# (nginx vererbt add_header NICHT in locations, die ein eigenes add_header haben.)
add_header X-Content-Type-Options   "nosniff"                                  always;
add_header X-Frame-Options          "SAMEORIGIN"                               always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"          always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"     always;
add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

# Optional — erst NACH Test aktivieren (ein falscher CSP-Wert kann das
# Kontaktformular / die Fonts blockieren). Danach im Browser prüfen, dass
# Absenden + Schriften noch funktionieren:
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'" always;
